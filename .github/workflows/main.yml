name: Release-Bot CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Dependencies
        working-directory: gintama-genius-web
        run: pnpm install

      - name: Run Linter
        working-directory: gintama-genius-web
        run: pnpm run lint

      - name: Run Tests
        working-directory: gintama-genius-web
        run: pnpm run test

      - name: Build Application
        working-directory: gintama-genius-web
        run: pnpm run build
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}

  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
